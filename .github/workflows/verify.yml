name: Verify MERN prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install and syntax-check API
        working-directory: server
        run: |
          npm ci
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        working-directory: server
        run: npm test
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build
